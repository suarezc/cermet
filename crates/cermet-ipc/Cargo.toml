[package]
name = "cermet-ipc"
description = "cermetd transport/auth shim: peer-cred, length-prefixed JSON codec, challenge-response hello. TRANSPORT + AUTH ONLY — never touches the Broker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# challenge-response proof
hmac = "0.12"
sha2 = "0.10"
# constant-time proof comparison
subtle = "2"
# zeroize the in-transit provider token (RedactedToken) on drop so a successful ingest leaves no
# recoverable copy in the daemon/app heap.
zeroize = "1"
# fresh per-connection nonce
rand = "0.8"
# at-rest wrap of the enrollment secret.
# `rand` pulls password_hash's salt RNG (SaltString::generate / OsRng).
argon2 = { version = "0.5", features = ["rand"] }
# kernel-attested peer credentials over the UDS — one file for the platform split.
# "signal": killpg for the bounded-shutdown kill of a frozen shell plan's process group.
# "poll"+"event": non-consuming hangup observation (Linux POLLHUP / macOS kqueue EV_EOF,
# which fires at close even with unread data) so a stdio server sees the client close its pipe
# independently of the unread backlog.
nix = { version = "0.26.4", features = ["socket", "uio", "signal", "poll", "event"] }
# The keyless no-secret wire types, reused verbatim.
cermet-lang = { path = "../cermet-lang" }

[dev-dependencies]
tempfile = "3"
# Privileged second-uid harness (tests/priv_uid_harness.rs): fork/waitpid +
# setuid/setgid/setgroups + chown to drop a child to a real second uid. Extra feature
# gates ("process","user","fs") are TEST-ONLY; the runtime `nix` dep above stays narrow
# ("socket","uio"). Same 0.26.4 pin, so no new version enters the tree.
nix = { version = "0.26.4", features = ["socket", "uio", "process", "user", "fs"] }

[lib]
doctest = false
