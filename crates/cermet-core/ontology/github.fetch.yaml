review:
  summary: Refresh this host's mirror of a repository from the upstream so a read stream can serve it.
  cautions:
    - Not requestable; the read stream at git.sock is its door.
    - A failed refresh REFUSES; a stale mirror is never served in its place.
    - The refresh is total and pruning, so the mirror's branches equal the upstream's.
