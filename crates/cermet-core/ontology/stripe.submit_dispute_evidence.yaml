review:
  summary: Submit provider-staged evidence on one exact dispute using only the frozen submit true control; this action stages no evidence itself.
  cautions:
    - 'Standalone semantic: this submits whatever evidence is already staged provider-side on the exact dispute.'
    - Cermet does not prove a relation to a prior stage grant and cannot prevent out-of-band evidence drift between staging and submission.
    - The action is loaded for sandbox and design validation; the provider-staged relation is not falsely claimed solved.
    - The LIKELY native ceiling is RAK Disputes Write or App dispute_write; exact IAM and submission-count behavior require sandbox live proof.
    - Submission is not automatically retried after an ambiguous timeout because the bank-facing effect is irreversible and non-idempotent.
