schema: cermet.grounded-ontology/v1
provider: github
action: create_branch
binds:
  provider_descriptor_sha256: 38fd952acd1a1f5b4b58667e86a31a9a70fb9079ebc3c5c7502af8f05ce08204
  action_template_sha256: 5f15d64b8876a94fba96c5a8cdd9c8820468b90626205d441aa3e80838ea8aa2
semantics:
  resource_family: git_reference
  provider_operation: ref_create
  risk_class: external_state_change
  sensitivity: source_code
  reversibility: compensatable
  completion: terminal
  idempotency: non_idempotent
review:
  summary: Create one new Git ref on a pinned repository at an exact immutable source OID.
  cautions:
    - An already-existing ref is refused (422); a create never moves an existing branch.
    - source_oid must be an exact commit OID (git_oid), never a branch name.
    - Durable-broker-only write; absent from the daemonless surface.
sources:
