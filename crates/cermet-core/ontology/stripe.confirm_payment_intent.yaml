schema: cermet.grounded-ontology/v1
provider: stripe
action: confirm_payment_intent
binds:
  provider_descriptor_sha256: f6f4e0bef96115d82365bfea71a2315dbff49e1e66036104f13e05d34c28ae5b
  action_template_sha256: 96a46e7c9b15c5dd10516baf510c8a201207eee0f203e46033fc5e5b154a9db0
semantics:
  resource_family: payment_intent
  provider_operation: confirm_off_session
  risk_class: external_state_change
  sensitivity: personal
  reversibility: compensatable
  completion: asynchronous
  idempotency: idempotent
review:
  summary: Confirm one exact funds_collect PaymentIntent with one exact customer-owned PaymentMethod and frozen off-session failure behavior.
  cautions:
    - Evidence and the fresh precondition require a confirmable status, exact method owner, and unchanged account, mode, currency, customer, and amount.
    - application_fee_amount, transfer_data, on_behalf_of, setup_future_usage, hooks, and method-level future-use or capture overrides must be absent.
    - off_session and error_on_requires_action are true; any customer-action requirement is a provider rejection, never a bearer output.
    - Success is raw-response proved against the exact intent, method, amount, currency, customer, methods, mode, and capture-dependent terminal status.
    - Refund or cancellation is a separate grant; this action neither executes nor implies compensation.
    - Sandbox proof must confirm safe-subset response shapes and automatic, automatic_async, and manual capture status behavior.
sources:
  - STRIPE-ACCOUNT-RETRIEVE
  - STRIPE-PAYMENT-INTENT-RETRIEVE
  - STRIPE-PAYMENT-METHOD-RETRIEVE
  - STRIPE-PAYMENT-INTENT-CONFIRM
  - STRIPE-RESTRICTED-KEYS
  - STRIPE-APP-PERMISSIONS
