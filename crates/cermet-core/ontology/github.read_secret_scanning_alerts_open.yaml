binds:
  provider_descriptor_sha256: 38fd952acd1a1f5b4b58667e86a31a9a70fb9079ebc3c5c7502af8f05ce08204
  action_template_sha256: 624660bb0c0db1161d8fdd5392e96068dacad746d866d85726661b0bbfbc20a3
semantics:
  resource_family: secret_scanning_alert
  provider_operation: secret_scanning_alerts_list
  risk_class: sensitive_observation
  sensitivity: security
  reversibility: not_applicable
  completion: terminal
  idempotency: read
review:
  summary: List one bounded first page of open secret-scanning alerts, projecting alert identifiers and safe security metadata while dropping literal leaked secrets.
  cautions:
    - >-
      THIS VERB RETURNS DETECTED SECRET MATERIAL VERBATIM. The verbatim response contract
      retired every projection, so an alert object's `secret` member reaches the
      receipt if GitHub sends it.
    - >-
      The one surviving bound is REQUEST-side, the frozen hide_secret=true query literal, which
      tells GitHub not to send the value at all. `retention: none` stores no artifact.
    - >-
      locations_url and validity are NO LONGER dropped; leak location and live validity ride the
      response.
    - A 404 means secret scanning is unavailable, disabled, or inaccessible, never an empty alert list.
    - The open-alert set is point-in-time and can change between reads.
sources:
  - GH-REST-SECRET-SCANNING
  - GH-REST-PAGINATION
