schema: cermet.grounded-ontology/v1
provider: github
action: read_workflow_runs
binds:
  provider_descriptor_sha256: 38fd952acd1a1f5b4b58667e86a31a9a70fb9079ebc3c5c7502af8f05ce08204
  action_template_sha256: c783276d022d2d5d0e32498f79e900defcfa37e1e19c85d26a128bb69e1d0b24
semantics:
  resource_family: workflow_run
  provider_operation: workflow_runs_list
  risk_class: observation
  sensitivity: operational
  reversibility: not_applicable
  completion: terminal
  idempotency: read
review:
  summary: List the Actions workflow runs triggered against one exact commit on a pinned repository.
  cautions:
    - Selection is by head_sha and not by branch, because a tag-triggered run reports the tag as its head_branch.
    - Run status and conclusion are point-in-time; a run still executing changes them between reads.
    - The read is one bounded page of at most twenty runs and there is no cursor; total_count is what reveals a truncated list.
    - A commit can have runs from several workflows, so choosing which run to diagnose is the caller's decision, not this verb's.
sources:
  - GH-REST-WORKFLOW-RUNS
