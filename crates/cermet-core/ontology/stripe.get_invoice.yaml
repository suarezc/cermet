review:
  summary: Retrieve one exact invoice's billing-state and amount summary without customer PII, payment instruments, line items, or hosted document URLs.
  cautions:
    - Invoice ID is the sole provider-consumed identity; no implicit account list or expansion is available.
    - Customer is retained only as its opaque ID; customer contact fields, lines, metadata, invoice PDF, and hosted URL are omitted.
    - The LIKELY native ceiling is RAK Invoices Read or App invoice_read; sandbox proof remains deferred.
