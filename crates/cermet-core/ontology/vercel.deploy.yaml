  action_template_sha256: c60c4d3cbd3439d71bc49cfbd8603214fbd905e1819a3bdb0f66c4b04feee01b
semantics:
  resource_family: deployment
  provider_operation: relay_deploy
  risk_class: external_state_change
  sensitivity: source_code
  reversibility: compensatable
  completion: asynchronous
  idempotency: non_idempotent
review:
  summary: Credential one native-CLI deploy of a pinned project at a frozen, sentence-adjudicated target, through the loopback relay.
  cautions:
    - team is optional and the Vercel scope binds only when named; omit it and the deploy follows whatever scope the native CLI configuration selects, recorded only on the relay hop targets.
    - team accepts the team_ id or the team slug; a slug is resolved once at request time with the vaulted token and the resolved team_ id is what freezes, so sentences keep pinning ids and an unresolvable name denies.
    - A rule that pins team refuses a request that named no scope; absent is not a value.
    - Deploy content is execute-time and unbound; approval is content-blind by design.
    - A deployment URL is public until the deployment is deleted, so review it after publication.
    - target is sentence-adjudicated; a bare allow of this verb includes production deploys.
    - The grant handle is a live loopback bearer in agent space for the session TTL.
    - CLI traffic drift fails closed; the predicate needs a human update, never a widening.
sources:
