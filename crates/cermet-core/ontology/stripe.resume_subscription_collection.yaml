    - The form wire must be exactly pause_collection=; no pause behavior, resumption date, pricing, payment, or proration option is available.
    - The null assertion proves the clear response reports pause_collection as present JSON null; a missing or non-null value is a postcondition mismatch requiring reconciliation.
