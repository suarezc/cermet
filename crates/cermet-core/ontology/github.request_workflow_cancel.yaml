schema: cermet.grounded-ontology/v1
provider: github
action: request_workflow_cancel
binds:
  provider_descriptor_sha256: 38fd952acd1a1f5b4b58667e86a31a9a70fb9079ebc3c5c7502af8f05ce08204
  action_template_sha256: 887b51dd6b8a20b79043471ea5aab4f149864c5728d470e7d90846fc50054e5d
semantics:
  resource_family: workflow_run
  provider_operation: workflow_run_cancel_request
  risk_class: external_state_change
  sensitivity: operational
  reversibility: irreversible
  completion: accepted
  idempotency: non_idempotent
review:
  summary: Request cancellation of one Actions workflow run, guarded by a verified match of the run's observed head SHA to the approved pin.
  cautions:
    - Step 1 GETs the run and fails closed unless head_sha equals the approved pin (run/head mismatch).
    - HTTP 202 is accepted, not terminal; an already-terminal run returns 409 and fails closed.
    - Durable-broker-only write; absent from the daemonless surface.
sources:
