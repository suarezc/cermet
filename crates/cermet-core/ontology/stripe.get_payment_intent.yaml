review:
  summary: Retrieve one exact PaymentIntent's amount and lifecycle summary while structurally excluding its client secret, payment instrument, source, and next action.
  cautions:
    - No expand or client_secret query parameter exists; the server-side retrieval uses only the exact PaymentIntent ID.
    - Narrow keep, retention none, and status-only errors prevent the provider's client capability and payment details from leaving execution.
    - The LIKELY native ceiling is RAK Payment Intents Read or App payment_intent_read; sandbox proof remains deferred.
