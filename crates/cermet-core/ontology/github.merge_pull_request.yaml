schema: cermet.grounded-ontology/v1
provider: github
action: merge_pull_request
binds:
  provider_descriptor_sha256: 38fd952acd1a1f5b4b58667e86a31a9a70fb9079ebc3c5c7502af8f05ce08204
  action_template_sha256: 44b5d9ea853cf6df172c72c2d55a4e759b0ccbbb2fa82ad037a55040396b012c
semantics:
  resource_family: pull_request
  provider_operation: pull_request_merge
  risk_class: external_state_change
  sensitivity: source_code
  reversibility: compensatable
  completion: terminal
  idempotency: provider_cas
review:
  summary: Merge one pull request by exact number under GitHub's own head-OID CAS, with the merge method frozen at approval.
  cautions:
    - The frozen sha is the provider-enforced CAS; a head that moved after approval returns 409 and merges nothing.
    - A draft or otherwise unmergeable pull request returns 405 and fails closed; marking a pull request ready is not part of this verb.
    - merge_method is not enum-checked at admission (the grammar has formats, not value sets); GitHub rejects an unknown method and a sentence pin is the narrowing control.
    - A merge writes to the base branch and can trigger downstream automation; it is compensatable by revert, not by undo.
sources:
  - GH-REST-PULL-REQUESTS
  - GH-REST-BEST-PRACTICES
