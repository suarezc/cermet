schema: cermet.grounded-ontology/v1
provider: stripe
action: create_standard_payout
binds:
  provider_descriptor_sha256: f6f4e0bef96115d82365bfea71a2315dbff49e1e66036104f13e05d34c28ae5b
  action_template_sha256: 8ece8a2b6fe8fde6dd950815dcc54c866e6d4c69dd408d2f7de51605e5587156
semantics:
  resource_family: payout
  provider_operation: create_standard
  risk_class: external_state_change
  sensitivity: operational
  reversibility: compensatable
  completion: asynchronous
  idempotency: idempotent
review:
  summary: Create one funds_outbound standard payout for a bounded amount and exact source type to one exact eligible bank destination.
  cautions:
    - Evidence resolves account, mode, and destination currency and requires payouts enabled plus one typed sufficient source balance.
    - Fresh checks repeat payouts-enabled, balance, destination ownership, destination status, and currency immediately before mutation.
    - destination and source_type are required exact inputs; no implicit or default destination can execute.
    - method is frozen standard; instant payout, transfer, top-up, and external-account mutation are absent and separately authorized if ever shipped.
    - Raw success proof requires exact amount, currency, destination, source type, mode, method standard, and status pending.
    - Sandbox proof must confirm external-account account/status fields, balance livemode/source_types shape, manual-payout eligibility, and native ceilings.
sources:
  - STRIPE-ACCOUNT-RETRIEVE
  - STRIPE-BALANCE-RETRIEVE
  - STRIPE-EXTERNAL-ACCOUNT-RETRIEVE
  - STRIPE-PAYOUT-CREATE
  - STRIPE-RESTRICTED-KEYS
  - STRIPE-APP-PERMISSIONS
