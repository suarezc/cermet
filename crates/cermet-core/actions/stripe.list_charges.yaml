provider: stripe
action: list_charges
fields:
  - { name: customer, type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [customer]
execution_targets: [customer]
http:
  steps:
    - id: list
      method: GET
      path: /v1/charges
      query: { customer: "{customer}", limit: "10" }
      require: [data, has_more]
      expect_literal: { has_more: false }
