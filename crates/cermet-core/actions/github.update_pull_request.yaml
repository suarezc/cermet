# Every editable field is OPTIONAL, and that is load-bearing on a PATCH: an absent optional field
# freezes as ABSENCE and `{x?}` drops the enclosing key from the wire, so a title-only edit sends
# the title and nothing else. Required-with-null would make a title edit clobber body and state.
# `state` is not enum-checked: the grammar has admission FORMATS, not closed value sets. GitHub
# refuses anything outside {open, closed} with a 422, which fails closed like any other non-2xx;
# the narrowing control is the sentence pin.
# A request supplying none of the three optional fields is a legal no-op PATCH that GitHub answers
# 200 with the unchanged pull request. Not special-cased — the receipt shows it plainly.
provider: github
action: update_pull_request
fields:
  - { name: owner,  type: str, required: true,  class: identity,     binding: exact_resource_pin }
  - { name: name,   type: str, required: true,  class: identity,     binding: exact_resource_pin }
  - { name: number, type: str, required: true,  class: identity,     binding: exact_resource_pin, format: uint }
  - { name: state,  type: str, required: false, class: identity,     binding: exact_resource_pin }
  - { name: title,  type: str, required: false, class: free_payload, binding: unbound }
  - { name: body,   type: str, required: false, class: free_payload, binding: unbound }
consumes: [owner, name, number, state, title, body]
execution_targets: [owner, name, number]
http:
  steps:
    - id: update
      method: PATCH
      path: /repos/{owner}/{name}/pulls/{number}
      success_statuses: [200]
      require: [number, state]
      body:
        state: "{state?}"
        title: "{title?}"
        body: "{body?}"
