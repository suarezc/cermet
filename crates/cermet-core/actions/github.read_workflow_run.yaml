# Action template for github.read_workflow_run (observation). Read ONE Actions
# workflow run on the frozen repository, selected by its EXACT immutable `run_id` (an exact-pinned
# identity execution target). A pure GET: owner/name plus the run ID address exactly one run — no
# name-only or filter widening. `run_id` carries `format: uint` (canonical bare positive decimal), so
# "1"/"01" can never be two pins for one run.
#
# The response returns the run's state facts — `status`, `conclusion`, the immutable
# `head_sha` the run was triggered against, `run_attempt`, and `event` — plus the stable `id`.
#. This is the fresh read a human/agent observes BEFORE deciding to request a cancel
# (request_workflow_cancel verifies the observed head against the approved pin).
provider: github
action: read_workflow_run
fields:
  - { name: owner,  type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,   type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: run_id, type: str, required: true, class: identity, binding: exact_resource_pin, format: uint }
consumes: [owner, name, run_id]
execution_targets: [owner, name, run_id]
http:
  steps:
    - id: get
      method: GET
      path: /repos/{owner}/{name}/actions/runs/{run_id}
