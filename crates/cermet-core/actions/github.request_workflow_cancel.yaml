# GitHub's cancel endpoint accepts no body, so a bare POST could not honor the approved head. Step 1
# GETs the run and refuses unless its `head_sha` equals the pin, BEFORE any mutation — which is what
# makes `head_sha` a genuinely executed identity rather than a hollow approved-but-unexecuted pin.
# 202 is the accepted evidence and its body is empty; an already-terminal run answers 409 and fails
# closed like any other undeclared status.
provider: github
action: request_workflow_cancel
fields:
  - { name: owner,    type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,     type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: run_id,   type: str, required: true, class: identity, binding: exact_resource_pin, format: uint }
  - { name: head_sha, type: str, required: true, class: identity, binding: exact_resource_pin, format: git_oid }
consumes: [owner, name, run_id, head_sha]
execution_targets: [owner, name, run_id, head_sha]
http:
  steps:
    - id: verify_head
      method: GET
      path: /repos/{owner}/{name}/actions/runs/{run_id}
      success_statuses: [200]
      expect_eq:
        head_sha: head_sha
    - id: cancel
      method: POST
      path: /repos/{owner}/{name}/actions/runs/{run_id}/cancel
      success_statuses: [202]
