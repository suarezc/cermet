# GitHub's create-ref endpoint refuses an ALREADY-EXISTING ref with 422 and no `optional_ok`
# tolerates it, so a request to recreate a branch fails closed rather than silently moving it.
# `new_ref` and `source_oid` ride the BODY and are still execution targets, so a create can never
# land at a name or a commit the approval did not fix.
provider: github
action: create_branch
fields:
  - { name: owner,      type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,       type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: new_ref,    type: str, required: true, class: identity, binding: exact_resource_pin, format: git_branch_ref }
  - { name: source_oid, type: str, required: true, class: identity, binding: exact_resource_pin, format: git_oid }
consumes: [owner, name, new_ref, source_oid]
execution_targets: [owner, name, new_ref, source_oid]
http:
  steps:
    - id: create
      method: POST
      path: /repos/{owner}/{name}/git/refs
      success_statuses: [201]
      require: [ref, object.sha]
      body:
        ref: "{new_ref}"
        sha: "{source_oid}"
