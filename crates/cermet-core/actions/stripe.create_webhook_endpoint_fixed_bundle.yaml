# Create one webhook endpoint at an exact HTTPS URL subscribed to the same fixed two-event bundle
# the corpus update verb pins. A caller-chosen event list is absent.
# Stripe returns the endpoint's signing secret in this response and only in this one, so the body
# reaches the requester but is never stored: retention is none.
provider: stripe
action: create_webhook_endpoint_fixed_bundle
fields:
  - { name: url, type: str, required: true, class: identity, binding: exact_resource_pin, format: https_url }
  - { name: mode, type: str, required: false, class: identity, binding: exact_resource_pin, source: credential }
consumes: [url]
execution_targets: [url, mode]
http:
  steps:
    - id: create
      method: POST
      path: /v1/webhook_endpoints
      body_encoding: form
      body:
        url: "{url}"
        enabled_events: [charge.succeeded, charge.failed]
      success_statuses: [200]
      require: [id, object, url, status, enabled_events, livemode]
      expect_eq: { url: url }
      expect_literal: { object: webhook_endpoint, enabled_events: [charge.succeeded, charge.failed] }
      retention: none
