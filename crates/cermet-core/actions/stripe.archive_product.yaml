# Deactivate one exact product; this is the reversible archive operation, never delete.
provider: stripe
action: archive_product
fields:
  - { name: product, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: mode, type: str, required: false, class: identity, binding: exact_resource_pin, source: credential }
consumes: [product]
execution_targets: [product, mode]
http:
  steps:
    - id: archive
      method: POST
      path: /v1/products/{product}
      body_encoding: form
      body: { active: false }
      success_statuses: [200]
      require: [id, active]
      expect_literal: { active: false }
