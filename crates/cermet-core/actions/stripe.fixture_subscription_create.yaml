# Create one incomplete helper subscription whose finalized open invoice is retained, then one active
# test subscription. Both use the same exact customer, attached PaymentMethod, and bounded price.
# The price is pinned request-side (frozen identity field); `require` stays on object-safe paths
# because the core's dotted lookups do not traverse arrays.
provider: stripe
action: fixture_subscription_create
fields:
  - { name: account,        type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: customer,       type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: payment_method, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: price,          type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [account, customer, payment_method, price]
execution_targets: [account, customer, payment_method, price]
http:
  steps:
    - id: bind_account
      method: GET
      path: /v1/account
      success_statuses: [200]
      expect_eq: { id: account }
    - id: prove_test_mode
      method: GET
      path: /v1/balance
      success_statuses: [200]
      expect_literal: { object: balance, livemode: false }
    - id: create_open_invoice
      method: POST
      path: /v1/subscriptions
      body_encoding: form
      body:
        customer: "{customer}"
        default_payment_method: "{payment_method}"
        items: [{ price: "{price}" }]
        collection_method: charge_automatically
        payment_behavior: default_incomplete
      success_statuses: [200]
      require: [id, object, customer, status, items.data, latest_invoice, livemode]
      capture: { open_invoice: "$.latest_invoice" }
    - id: create_active
      method: POST
      path: /v1/subscriptions
      body_encoding: form
      body:
        customer: "{customer}"
        default_payment_method: "{payment_method}"
        items: [{ price: "{price}" }]
        collection_method: charge_automatically
        payment_behavior: error_if_incomplete
      success_statuses: [200]
      require: [id, object, customer, status, items.data, livemode]
      expect_eq: { customer: customer }
      expect_literal: { object: subscription, status: active, livemode: false }
      result_captures: { open_invoice: open_invoice }
