# Selected by `head_sha` and NOT a branch pin: a run triggered by a TAG push reports the tag as its
# `head_branch`, so a branch filter would return nothing for exactly the case a release needs. The
# commit is the same fact under every trigger.
# An annotated tag's push receipt carries the TAG OBJECT's oid, which is a well-formed `git_oid` and
# so cannot be refused here; the provider answers with an honest empty list. CI ran against the
# commit it points at (`git rev-parse <tag>^{commit}`).
# `format: git_oid` keeps a ref NAME out of the query, which GitHub would resolve — a mutable name
# is not an identity a sentence can pin (T1: a steered agent asking about "main" instead of the
# commit it actually pushed).
# `per_page=20` is fixed with no cursor: one bounded page, with `total_count` making truncation
# visible. `require` proves the two keys that make the body a run list, so a 200 carrying neither
# fails closed rather than reading as "no runs".
provider: github
action: read_workflow_runs
fields:
  - { name: owner,    type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,     type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: head_sha, type: str, required: true, class: identity, binding: exact_resource_pin, format: git_oid }
consumes: [owner, name, head_sha]
execution_targets: [owner, name, head_sha]
http:
  steps:
    - id: runs
      method: GET
      path: /repos/{owner}/{name}/actions/runs
      query:
        head_sha: "{head_sha}"
        per_page: "20"
      success_statuses: [200]
      require: [total_count, workflow_runs]
