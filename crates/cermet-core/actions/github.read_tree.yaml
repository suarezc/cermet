# Recursion is frozen OFF (the endpoint's `recursive` query param is omitted), so one tree level
# comes back; `truncated` rides in the response, so a listing GitHub itself capped is visible.
# `format: git_oid` refuses a ref/branch NAME, which this endpoint would otherwise accept and
# resolve — pinning a moving pointer instead of an immutable object.
provider: github
action: read_tree
fields:
  - { name: owner,    type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,     type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: tree_sha, type: str, required: true, class: identity, binding: exact_resource_pin, format: git_oid }
consumes: [owner, name, tree_sha]
execution_targets: [owner, name, tree_sha]
http:
  steps:
    - id: get
      method: GET
      path: /repos/{owner}/{name}/git/trees/{tree_sha}
