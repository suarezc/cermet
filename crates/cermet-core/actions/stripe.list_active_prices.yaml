# List only the first twenty active prices for one exact product. No cursor, inactive, or account-wide
# variant exists.
provider: stripe
action: list_active_prices
fields:
  - { name: product, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: mode, type: str, required: false, class: identity, binding: exact_resource_pin, source: credential }
consumes: [product]
execution_targets: [product, mode]
http:
  steps:
    - id: list
      method: GET
      path: /v1/prices
      success_statuses: [200]
      query:
        product: "{product}"
        active: "true"
        limit: "20"
      require: [data, has_more]
