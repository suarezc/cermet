# NOT requestable: the decision is git's own `update` hook running on the daemon's mirror, driven by
# a plain `git push`. The request path refuses the verb and says so.
# `mirror_old_oid` is the MIRROR's tip, not the upstream's, so a rule pinning it pins the daemon's
# view. It is not a compare-and-swap either — the upstream server's fast-forward rule is the
# concurrency control — and an absent value simply means the mirror had no such ref.
# The receipt is derived from `git push --porcelain`: the upstream's own old oid rides beside the
# mirror's, separately labelled, because they legitimately differ. The hook confirms only on
# upstream success, so the mirror ref advances iff the upstream's did.
provider: github
action: push
fields:
  - { name: owner,   type: str, required: true,  class: identity, binding: exact_resource_pin }
  - { name: name,    type: str, required: true,  class: identity, binding: exact_resource_pin }
  - { name: branch,  type: str, required: true,  class: identity, binding: exact_resource_pin, format: git_branch_name }
  - { name: new_oid, type: str, required: true,  class: identity, binding: exact_resource_pin, format: git_oid }
  - { name: mirror_old_oid, type: str, required: false, class: identity, binding: exact_resource_pin, format: git_oid }
consumes: [owner, name, branch, new_oid, mirror_old_oid]
execution_targets: [owner, name, branch]
git:
  push:
    remote_path: "/{owner}/{name}.git"
    branch: branch
    new_oid: new_oid
    mirror_old_oid: mirror_old_oid
