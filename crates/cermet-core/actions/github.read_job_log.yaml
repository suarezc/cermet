# THE MINT SHAPE. GitHub answers this GET with `302`, an empty body, and a pre-signed,
# self-authorizing, ~60-second blob URL. The broker spends the credential once, hands back that
# scoped expiring capability, and stops; the agent's own credential-free `curl` moves the bytes. It
# never follows the redirect, opens a second origin, or reads a byte of the log.
# `retain_headers: [location]` lifts the minted URL into the broker-authored envelope beside the
# response; an absent `Location` fails the step closed, because a mint with nothing minted is not a
# success with a hole in it.
# The URL in the receipt is a DERIVED grant, never the vault credential: it authorizes one blob for
# about a minute and cannot be replayed against any other resource. A stale receipt's URL is dead,
# which is why this receipt is worth re-running rather than mining later.
provider: github
action: read_job_log
fields:
  - { name: owner,  type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,   type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: job_id, type: str, required: true, class: identity, binding: exact_resource_pin, format: uint }
consumes: [owner, name, job_id]
execution_targets: [owner, name, job_id]
http:
  steps:
    - id: mint
      method: GET
      path: /repos/{owner}/{name}/actions/jobs/{job_id}/logs
      success_statuses: [302]
      retain_headers: [location]
      retention: none
