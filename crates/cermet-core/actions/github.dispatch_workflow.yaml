# `ref`'s `git_branch_name` format reads narrower than it is: it applies git's check-ref-format to a
# BARE ref component, so it admits a tag as readily as a branch — correct here, because GitHub's
# dispatch endpoint takes either. It still refuses the qualified `refs/heads/...` spelling, so one
# ref has exactly one pin string, and the cross-repository `user:ref` form.
# `workflow` carries NO format on purpose: the vocabulary has no workflow-file shape, and the
# generic path-segment guard already refuses empties, dot segments, `/ ? # % \`, whitespace, and
# control characters.
# No `inputs` field: the `workflow_dispatch` inputs map is a free-form object whose field class is
# unsettled, and an unclassed object does not enter a frozen envelope.
provider: github
action: dispatch_workflow
fields:
  - { name: owner,    type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,     type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: workflow, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: ref,      type: str, required: true, class: identity, binding: exact_resource_pin, format: git_branch_name }
consumes: [owner, name, workflow, ref]
execution_targets: [owner, name, workflow, ref]
http:
  steps:
    - id: dispatch
      method: POST
      path: /repos/{owner}/{name}/actions/workflows/{workflow}/dispatches
      # Both arms are real: a live dispatch answers 200 carrying the run id it just started, the
      # reference documents 204 No Content. No `require` — it is evaluated on every accepted status
      # alike, and a 204's empty body would fail that arm closed.
      success_statuses: [200, 204]
      body:
        ref: "{ref}"
