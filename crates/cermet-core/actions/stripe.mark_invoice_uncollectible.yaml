# Mark one exact invoice uncollectible without accepting any update options.
provider: stripe
action: mark_invoice_uncollectible
fields:
  - { name: invoice, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: mode, type: str, required: false, class: identity, binding: exact_resource_pin, source: credential }
consumes: [invoice]
execution_targets: [invoice, mode]
http:
  steps:
    - id: mark_uncollectible
      method: POST
      path: /v1/invoices/{invoice}/mark_uncollectible
      success_statuses: [200]
      require: [id, status]
      expect_literal: { status: uncollectible }
