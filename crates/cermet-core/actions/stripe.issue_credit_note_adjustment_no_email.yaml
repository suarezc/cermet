# Issue only a bounded pre-payment invoice adjustment with no caller-selected line/shipping composition.
# Stripe may allocate the amount-level adjustment across invoice lines. No refund, customer-balance
# credit, out-of-band credit, memo/reason, effective-date override, or email is authorized.
provider: stripe
action: issue_credit_note_adjustment_no_email
fields:
  - { name: invoice, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: amount, type: int, required: true, class: side_effect, binding: bounded }
  - { name: mode, type: str, required: false, class: identity, binding: exact_resource_pin, source: credential }
consumes: [invoice, amount]
execution_targets: [invoice, mode]
http:
  steps:
    - id: issue
      method: POST
      path: /v1/credit_notes
      body_encoding: form
      body:
        invoice: "{invoice}"
        amount: "{amount}"
        email_type: none
      success_statuses: [200]
      require: [id, invoice, amount, currency, status, pre_payment_amount, post_payment_amount, type]
      expect_literal: { status: issued, type: pre_payment, post_payment_amount: 0 }
