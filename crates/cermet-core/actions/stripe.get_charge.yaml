provider: stripe
action: get_charge
fields:
  - { name: charge, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: mode, type: str, required: false, class: identity, binding: exact_resource_pin, source: credential }
consumes: [charge]
execution_targets: [charge, mode]
http:
  steps:
    - id: get
      method: GET
      path: /v1/charges/{charge}
