# Create one convention-named test customer. The first two reads bind the authenticated account and
# prove livemode=false before the sole mutation.
provider: stripe
action: fixture_customer_create
fields:
  - { name: account, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,    type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: email,   type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [account, name, email]
execution_targets: [account, name, email]
http:
  steps:
    - id: bind_account
      method: GET
      path: /v1/account
      success_statuses: [200]
      expect_eq: { id: account }
    - id: prove_test_mode
      method: GET
      path: /v1/balance
      success_statuses: [200]
      expect_literal: { object: balance, livemode: false }
    - id: create
      method: POST
      path: /v1/customers
      body_encoding: form
      body:
        name: "{name}"
        email: "{email}"
        description: "Cermet test fixture"
      success_statuses: [200]
      require: [id, object, name, email, livemode]
      expect_eq: { name: name, email: email }
      expect_literal: { object: customer, livemode: false }
