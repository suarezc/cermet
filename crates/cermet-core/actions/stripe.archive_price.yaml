# Deactivate one exact price; this is the reversible archive operation, never delete.
provider: stripe
action: archive_price
fields:
  - { name: price, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: mode, type: str, required: false, class: identity, binding: exact_resource_pin, source: credential }
consumes: [price]
execution_targets: [price, mode]
http:
  steps:
    - id: archive
      method: POST
      path: /v1/prices/{price}
      body_encoding: form
      body: { active: false }
      success_statuses: [200]
      require: [id, active]
      expect_literal: { active: false }
