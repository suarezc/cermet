# owner/name stay the execution targets because GitHub offers no numeric-id contents read: the
# repository IS addressed by owner/name. Downstream reads and writes anchor on the stable `id` and
# `node_id` the response carries, never on the mutable `full_name`.
provider: github
action: read_repo
fields:
  - { name: owner, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,  type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [owner, name]
execution_targets: [owner, name]
http:
  steps:
    - id: get
      method: GET
      path: /repos/{owner}/{name}
