# Retry collection for one exact open invoice using one exact customer-owned PaymentMethod. No
# configured/default method, routing, payment settings, forgiveness, or out-of-band payment is used.
# Supplying `payment_method` IS the not-out-of-band assertion: Stripe refuses `forgive` and
# `paid_out_of_band` alongside it even as false, so neither is sent.
provider: stripe
action: retry_invoice_payment
request_evidence: stripe.retry_invoice_payment.v1
money:
  preconditions: [invoice_open]
fields:
  - { name: invoice, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: payment_method, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: account, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: mode, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: currency, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: customer, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: amount, type: int, required: true, class: side_effect, binding: bounded }
  - { name: status, type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [invoice, payment_method]
execution_targets: [invoice, payment_method, account, mode, currency, customer, status]
http:
  steps:
    - id: pay
      method: POST
      path: /v1/invoices/{invoice}/pay
      body_encoding: form
      body:
        payment_method: "{payment_method}"
        off_session: true
      success_statuses: [200]
      require: [id, object, status, currency, customer, livemode, amount_remaining, amount_paid, attempt_count]
      expect_eq: { id: invoice, currency: currency, customer: customer, livemode: mode }
      expect_literal: { object: invoice, status: paid, amount_remaining: 0 }
      retention: none
