# Action template for github.create_pull_request (external_state_change). Open ONE pull
# request on the frozen repository, using the exact
# branch-addressed base/head values supplied in the original request. Both carry the strict
# `git_branch_name` format, which rejects GitHub's cross-repository `user:branch` syntax rather than
# admitting an unpinned source repository. The endpoint offers no OID/CAS to claim.
#
# owner/name/base/head are exact-pinned identity execution targets. title/body are required,
# request-time free_payload values: typed, capped, audited verbatim, HMAC-covered, and frozen before
# approval. Every declared field is consumed by the one POST. Fork/cross-repository controls are
# absent. This action neither marks a PR ready nor approves, merges, or requests changes.
#
# Product parity: `draft` is a DECLARED required identity
# field, not a frozen `draft: true` literal. Draft-only was policy baked into a template, which is
# the wrong layer: an operator who wants draft-only agents writes `where draft = true` in their
# sentence corpus, and one who wants ready PRs writes `draft = false` or omits the predicate. The
# value is still frozen at request time and HMAC-covered before approval like every other field, so
# the approver always knows which kind of PR they are allowing.
#
# The response is the created pull request VERBATIM, retained under the declared retention
# default; `require` proves the stable IDs. Only 201 Created is success.
provider: github
action: create_pull_request
fields:
  - { name: owner, type: str,  required: true, class: identity,     binding: exact_resource_pin }
  - { name: name,  type: str,  required: true, class: identity,     binding: exact_resource_pin }
  - { name: base,  type: str,  required: true, class: identity,     binding: exact_resource_pin, format: git_branch_name }
  - { name: head,  type: str,  required: true, class: identity,     binding: exact_resource_pin, format: git_branch_name }
  - { name: draft, type: bool, required: true, class: identity,     binding: exact_resource_pin }
  - { name: title, type: str,  required: true, class: free_payload, binding: unbound }
  - { name: body,  type: str,  required: true, class: free_payload, binding: unbound }
consumes: [owner, name, base, head, draft, title, body]
execution_targets: [owner, name, base, head, draft]
http:
  steps:
    - id: create
      method: POST
      path: /repos/{owner}/{name}/pulls
      success_statuses: [201]
      require: [id, number]
      body:
        title: "{title}"
        body: "{body}"
        head: "{head}"
        base: "{base}"
        draft: "{draft}"
