# `git_branch_name` on `base`/`head` rejects GitHub's cross-repository `user:branch` syntax, so a PR
# can never name an unpinned source repository.
# `draft` is a DECLARED field rather than a frozen `draft: true` literal: which kind of PR an agent
# may open is the operator's sentence (`... and draft = true`), not a policy baked into a vendored
# template. It freezes at request time like every other field, so the approver knows which they
# allow. The verb neither marks a PR ready nor approves, merges, or requests changes.
provider: github
action: create_pull_request
fields:
  - { name: owner, type: str,  required: true, class: identity,     binding: exact_resource_pin }
  - { name: name,  type: str,  required: true, class: identity,     binding: exact_resource_pin }
  - { name: base,  type: str,  required: true, class: identity,     binding: exact_resource_pin, format: git_branch_name }
  - { name: head,  type: str,  required: true, class: identity,     binding: exact_resource_pin, format: git_branch_name }
  - { name: draft, type: bool, required: true, class: identity,     binding: exact_resource_pin }
  - { name: title, type: str,  required: true, class: free_payload, binding: unbound }
  - { name: body,  type: str,  required: true, class: free_payload, binding: unbound }
consumes: [owner, name, base, head, draft, title, body]
execution_targets: [owner, name, base, head, draft]
http:
  steps:
    - id: create
      method: POST
      path: /repos/{owner}/{name}/pulls
      success_statuses: [201]
      require: [id, number]
      body:
        title: "{title}"
        body: "{body}"
        head: "{head}"
        base: "{base}"
        draft: "{draft}"
