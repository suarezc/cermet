# `sha` is GitHub's own compare-and-swap: the endpoint refuses with 409 unless the PR head still
# equals it, so the commit an approver ruled on is the commit that merges, and a branch that moved
# after approval fails closed instead of merging work nobody looked at. That makes it a genuinely
# EXECUTED identity, enforced by the provider rather than merely frozen in the resource.
# `merge_method` is not enum-checked: the grammar has admission FORMATS, not closed value sets.
# GitHub refuses anything outside {merge, squash, rebase} with a 422; the narrowing control is the
# sentence pin (`... and merge_method = squash`).
# `expect_literal: {merged: true}` makes a 200 that did not actually merge a postcondition failure
# rather than a silent success. Head drift arrives as 409 and unmergeable/draft as 405; both fail
# closed carrying the provider's body, which is the whole legible receipt.
provider: github
action: merge_pull_request
fields:
  - { name: owner,        type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,         type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: number,       type: str, required: true, class: identity, binding: exact_resource_pin, format: uint }
  - { name: sha,          type: str, required: true, class: identity, binding: exact_resource_pin, format: git_oid }
  - { name: merge_method, type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [owner, name, number, sha, merge_method]
execution_targets: [owner, name, number, sha, merge_method]
http:
  steps:
    - id: merge
      method: PUT
      path: /repos/{owner}/{name}/pulls/{number}/merge
      success_statuses: [200]
      require: [sha, merged]
      expect_literal: { merged: true }
      body:
        sha: "{sha}"
        merge_method: "{merge_method}"
