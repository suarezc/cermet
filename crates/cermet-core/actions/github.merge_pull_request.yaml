# Action template for github.merge_pull_request (PR-flow parity; external_state_change).
# Merge ONE pull request on the frozen repository, guarded by the exact head
# OID the approval was granted against.
#
# `sha` is the expected_head_oid pattern (push_commit / request_workflow_cancel) applied to a merge:
# GitHub's own CAS. The endpoint refuses with 409 unless the PR head still equals this value, so the
# commit an approver ruled on is the commit that merges — a branch that moved after approval fails
# closed instead of merging work nobody looked at. That makes `sha` a GENUINELY executed identity,
# enforced by the provider rather than merely frozen in the resource. It carries
# `format: git_oid`; `number` carries `format: uint`, so "1"/"01" can never be two pins for
# one PR.
#
# `merge_method` is a required identity field, so a sentence can pin it
# (`... and merge_method = squash`) and an approval that says "squash" can never rebase.
# NOTE (no enum in the grammar): the template language has admission FORMATS, not closed value sets,
# so `merge_method` is not enum-checked here — GitHub enforces the closed set {merge, squash, rebase}
# and rejects anything else with a 422, which fails closed like any other non-200. The operator's
# tool for narrowing it is the sentence pin, which is the stronger control anyway.
#
# Outcome: 200 is the ONLY success. `require` proves the merge commit's `sha` and the `merged` flag
# exist, and `expect_literal` requires `merged: true`, so a 200 that did not actually merge is a
# postcondition failure carrying the provider's body as proof rather than a silent success.
# NOTE (conflict classification): `conflict_on` classifies GraphQL error TYPES; this is REST, where
# the drift arrives as an HTTP 409 (head moved) and unmergeable/draft as 405. Both fail closed and
# return status + the provider's body verbatim, which is the legible receipt — no REST equivalent of
# push_commit's STALE_DATA tag exists to attach.
provider: github
action: merge_pull_request
fields:
  - { name: owner,        type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,         type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: number,       type: str, required: true, class: identity, binding: exact_resource_pin, format: uint }
  - { name: sha,          type: str, required: true, class: identity, binding: exact_resource_pin, format: git_oid }
  - { name: merge_method, type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [owner, name, number, sha, merge_method]
execution_targets: [owner, name, number, sha, merge_method]
http:
  steps:
    - id: merge
      method: PUT
      path: /repos/{owner}/{name}/pulls/{number}/merge
      success_statuses: [200]        # 200 only: 405 (not mergeable / draft) and 409 (sha drift) fail closed.
      require: [sha, merged]         # the merge commit's own OID and the merged flag must be present.
      expect_literal: { merged: true }
      body:
        sha: "{sha}"
        merge_method: "{merge_method}"
