# `event` is a DECLARED field rather than the frozen literal `COMMENT`. A GitHub review spelled
# `APPROVE` is a PROVIDER-domain write, not Cermet authority — Cermet's own grant-approval seam is
# never agent-reachable, ever — so restricting it is the operator's sentence (`... and event =
# COMMENT`), not a literal frozen into a vendored template.
# `event` is not enum-checked: the grammar has admission FORMATS, not closed value sets. GitHub
# refuses anything outside {APPROVE, REQUEST_CHANGES, COMMENT} with a 422, which fails closed.
provider: github
action: create_pull_request_review
fields:
  - { name: owner,     type: str, required: true, class: identity,     binding: exact_resource_pin }
  - { name: name,      type: str, required: true, class: identity,     binding: exact_resource_pin }
  - { name: number,    type: str, required: true, class: identity,     binding: exact_resource_pin, format: uint }
  - { name: commit_id, type: str, required: true, class: identity,     binding: exact_resource_pin, format: git_oid }
  - { name: event,     type: str, required: true, class: identity,     binding: exact_resource_pin }
  - { name: body,      type: str, required: true, class: free_payload, binding: unbound }
consumes: [owner, name, number, commit_id, event, body]
execution_targets: [owner, name, number, commit_id, event]
http:
  steps:
    - id: review
      method: POST
      path: /repos/{owner}/{name}/pulls/{number}/reviews
      # GitHub answers create-review with 200, not 201.
      success_statuses: [200]
      require: [id]
      body:
        commit_id: "{commit_id}"
        body: "{body}"
        event: "{event}"
