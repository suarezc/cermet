# A relay verb: the native `vercel` CLI runs as the agent's own uid and is pointed at cermetd's
# loopback relay with `--api`; the bearer slot carries the grant handle, never a credential. The
# `predicate` below is the whole enforceable surface, so CLI drift fails CLOSED — deploys break
# until a human updates this document.
# Deploy CONTENT is deliberately unbound: that freedom IS the effect ("deploy the current tree").
# `query_keys`/`body_keys` are VOCABULARY — the keys a sentence may pin. An undeclared key is
# forwarded and named (names only) on that hop's own record, which is where widening evidence
# arrives. Only a `bind` refuses.
# Unbound steering positions in the create body, each forwarded and reported, none refused:
#   `alias` — assigns a domain the sentence never named, and the outcome assert does not read it.
#   `customEnvironmentSlugOrId` — moves the deploy to another environment while `body.target` still
#     satisfies the frozen target; assert-invisible the same way.
#   `project`/`deploymentId` — redirect the create; DETECTED (never prevented) by the outcome assert.
#   `slug` (query) — Vercel's other spelling of the scope; not comparable to the id `team` freezes.
provider: vercel
action: deploy
# Resolves a team SLUG to Vercel's `team_…` id inside the daemon at request time, so what freezes on
# the grant is the id every `query.teamId` bind compares against. A name that resolves to nothing is
# an audited deny; the resolution decides how a scope is SPELT, never which scope the corpus admits.
request_canonicalization: vercel.deploy.team_scope.v1
fields:
  - { name: project, type: str, required: true, class: identity,    binding: exact_resource_pin }
  - { name: target,  type: str, required: true, class: side_effect, binding: exact_resource_pin }
  # Optional: omitted, it freezes as ABSENCE and every `query.teamId` bind then constrains nothing —
  # the deploy's scope follows whatever the CLI's own workspace configuration selects, and the hop
  # records are the only account of it.
  - { name: team,    type: str, required: false, class: identity,    binding: exact_resource_pin }
consumes: [project, target, team]
execution_targets: [project, target, team]
execution: relay
predicate:
  # THE effect. Vercel has no legal `target: preview` value, so the bind is `omit:preview`: a frozen
  # `preview` demands the key be absent or null, `production` demands the literal.
  - method: POST
    path: /v13/deployments
    once: true
    query_keys: [forceNew, skipAutoDetectionConfirmation, withLatestCommit, teamId]
    body_keys:
      - files
      - projectSettings
      - meta
      - gitMetadata
      - monorepoManager
      - regions
      - functions
      - routes
      - source
      - env
      - build
      - version
      - actor
      - headers
    bind:
      body.name: project
      body.target: "target|omit:preview"
      query.teamId: team
    # Write-once, off the 2xx response only: nothing is captured until the create lands, so a poll
    # before the create refuses.
    capture:
      deployment_id: id
    # DETECTION, NOT PREVENTION — the deployment already exists when the response is read. A
    # mismatch burns the session and writes one high-severity audit row carrying frozen-vs-observed.
    assert:
      name: project
      target: "target|omit:preview"
  - { method: GET, path: /v2/user }
  # Ratified AUTHORITY-FREE: the team is named in the PATH and the CLI sends no query at all. The
  # path segment and the admitted `teamId` key are read-only metadata whose disclosure is no greater
  # than the bindless `GET /v1/teams` below, which lists every team the token reaches.
  - { method: GET, path: /teams/*, query_keys: [teamId] }
  - { method: GET, path: /v1/teams }
  # Ratified AUTHORITY-FREE, same class: the linked-directory opener names a project in the PATH and
  # sends no query. Read-only project metadata, bounded by what the token can see; neither position
  # decides where a deployment lands. Every EFFECT-bearing hop keeps its own `query.teamId` bind, so
  # a redirected preamble read cannot move the deploy.
  - method: GET
    path: /v9/projects/*
    query_keys: [teamId]
  # The CLI's content-addressed upload protocol; the body is opaque bytes. A non-2xx aborts the
  # deploy rather than retrying, so hop count is bounded by the manifest — which is what makes an
  # aggregate cap safe. It bounds abuse (T2: an accident loop; T1: "while you're there, keep
  # uploading"), not any honest deploy.
  - method: POST
    path: /v2/files
    query_keys: [teamId]
    caps:
      max_uses: 4096
      max_total_bytes: 268435456
    bind:
      query.teamId: team
  # The post-create polls. The wildcard is pinned to the deployment THIS session created: reading
  # another deployment (T1: "while you're there, read the other build's log"; T2: a stale id) is not
  # this grant's consequence.
  - method: GET
    path: /v13/deployments/*
    query_keys: [withGitRepoInfo, teamId]
    bind:
      path.*: captured.deployment_id
      query.teamId: team
  - method: GET
    path: /v2/deployments/*/events
    query_keys: [builds, delimiter, direction, follow, limit, name, since, statusCode, until, teamId]
    bind:
      path.*: captured.deployment_id
      query.teamId: team
  - method: GET
    path: /v3/now/deployments/*/events
    query_keys: [builds, delimiter, direction, follow, format, limit, name, since, statusCode, until, teamId]
    bind:
      path.*: captured.deployment_id
      query.teamId: team
