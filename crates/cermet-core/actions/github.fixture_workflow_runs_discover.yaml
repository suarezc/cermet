# Discover a bounded workflow-run page for one exact repository branch and head SHA.
provider: github
action: fixture_workflow_runs_discover
fields:
  - { name: owner,    type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,     type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: branch,   type: str, required: true, class: identity, binding: exact_resource_pin, format: git_branch_name }
  - { name: head_sha, type: str, required: true, class: identity, binding: exact_resource_pin, format: git_oid }
consumes: [owner, name, branch, head_sha]
execution_targets: [owner, name, branch, head_sha]
http:
  steps:
    - id: runs
      method: GET
      path: /repos/{owner}/{name}/actions/runs
      query:
        branch: "{branch}"
        head_sha: "{head_sha}"
        per_page: "20"
      success_statuses: [200]
      require: [total_count, workflow_runs]
