# Clear pause_collection on one exact subscription; an empty form value is Stripe's documented clear.
provider: stripe
action: resume_subscription_collection
fields:
  - { name: subscription, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: mode, type: str, required: false, class: identity, binding: exact_resource_pin, source: credential }
consumes: [subscription]
execution_targets: [subscription, mode]
http:
  steps:
    - id: resume_collection
      method: POST
      path: /v1/subscriptions/{subscription}
      body_encoding: form
      body: { pause_collection: "" }
      success_statuses: [200]
      require: [id, status]
      expect_literal: { pause_collection: null }
