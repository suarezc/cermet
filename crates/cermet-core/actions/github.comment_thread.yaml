# The exact thread `number` is an execution target, so an allow scopes to ONE thread and an agent
# can never fan a comment across the tracker.
provider: github
action: comment_thread
fields:
  - { name: owner,  type: str, required: true, class: identity,     binding: exact_resource_pin }
  - { name: name,   type: str, required: true, class: identity,     binding: exact_resource_pin }
  - { name: number, type: str, required: true, class: identity,     binding: exact_resource_pin, format: uint }
  - { name: body,   type: str, required: true, class: free_payload, binding: unbound }
consumes: [owner, name, number, body]
execution_targets: [owner, name, number]
http:
  steps:
    - id: comment
      method: POST
      path: /repos/{owner}/{name}/issues/{number}/comments
      success_statuses: [201]
      require: [id]
      body:
        body: "{body}"
