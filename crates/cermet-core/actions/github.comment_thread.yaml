# Action template for github.comment_thread (external_state_change). Post ONE
# comment on the frozen issue/PR thread. Addressing is frozen identity: owner/name plus the EXACT
# thread `number` (an exact thread target) — all exact-pinned execution
# targets, so an allow scopes to one thread and an agent can never fan a comment across the tracker.
# `body` is a REQUEST-TIME free_payload hole (agent-authored, typed str, size-capped, audited verbatim,
# frozen at mint — no runtime fill). No identity/side_effect/secret field is free_payload.
#
# `number` carries `format: uint` — a canonical bare positive decimal, so "1"/"01" can never
# be two distinct pins for one thread. the response returns the created comment's `id` and `html_url`;
#. 201 is the created evidence; any non-2xx fails closed.
provider: github
action: comment_thread
fields:
  - { name: owner,  type: str, required: true, class: identity,     binding: exact_resource_pin }
  - { name: name,   type: str, required: true, class: identity,     binding: exact_resource_pin }
  - { name: number, type: str, required: true, class: identity,     binding: exact_resource_pin, format: uint }
  - { name: body,   type: str, required: true, class: free_payload, binding: unbound }
consumes: [owner, name, number, body]
execution_targets: [owner, name, number]
http:
  steps:
    - id: comment
      method: POST
      path: /repos/{owner}/{name}/issues/{number}/comments
      success_statuses: [201]        # 201 Created only.
      require: [id]                  # the created comment id must be present, never null.
      body:
        body: "{body}"
