# NOT requestable: the door is the read stream itself — the daemon decides it at `git.sock`
# stream-open for `upload-pack`, reached by a plain `git fetch`/`git clone` against a `cermet::`
# remote. The request path refuses the verb.
# A refresh is total (`+refs/heads/*:refs/heads/*--prune`), so there is deliberately no per-branch
# vocabulary: an allowed repository's refresh brings all of its branches, because a mirror serving a
# subset would be a mirror that lies about the remote.
# Failure is a REFUSAL, never a fall back to serving what the mirror already held — that fallback is
# the bug this verb closes. The receipt is derived from the mirror's own refs snapshotted either
# side of the hop; a pruned ref reports `to: null`.
provider: github
action: fetch
fields:
  - { name: owner, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,  type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [owner, name]
execution_targets: [owner, name]
git:
  fetch:
    remote_path: "/{owner}/{name}.git"
