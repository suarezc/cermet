# SAY WHAT WE SHIP: under the verbatim response contract this verb RETURNS DETECTED SECRET MATERIAL
# — GitHub's alert objects carry the leaked third-party credential in `secret`. The surviving bound
# is request-side: the fixed `hide_secret=true` literal instructs GitHub not to send the value at
# all, and `retention: none` stores no artifact. `github` is not a product-enabled provider, so
# nothing agent-reachable is affected today; the product-enable decision is what reopens this.
provider: github
action: read_secret_scanning_alerts_open
fields:
  - { name: owner, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,  type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [owner, name]
execution_targets: [owner, name]
http:
  steps:
    - id: list
      method: GET
      path: /repos/{owner}/{name}/secret-scanning/alerts
      success_statuses: [200]
      query:
        state: "open"
        per_page: "30"
        hide_secret: "true"
      retention: none
