# Create one test charge with Stripe's tok_createDispute token; Stripe asynchronously creates the
# dispute that the bounded discovery/corpus reads then identify.
provider: stripe
action: fixture_dispute_charge_create
fields:
  - { name: account,  type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: amount,   type: int, required: true, class: side_effect, binding: bounded, max_int: 100 }
  - { name: currency, type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [account, amount, currency]
execution_targets: [account, currency]
http:
  steps:
    - id: bind_account
      method: GET
      path: /v1/account
      success_statuses: [200]
      expect_eq: { id: account }
    - id: prove_test_mode
      method: GET
      path: /v1/balance
      success_statuses: [200]
      expect_literal: { object: balance, livemode: false }
    - id: create
      method: POST
      path: /v1/charges
      body_encoding: form
      body:
        amount: "{amount}"
        currency: "{currency}"
        source: tok_createDispute
        description: "Cermet dispute fixture"
      success_statuses: [200]
      require: [id, object, amount, currency, paid, status, livemode]
      capture: { dispute_charge_id: "$.id" }
    - id: discover
      method: GET
      path: /v1/disputes
      query: { charge: "{dispute_charge_id}", limit: "10" }
      success_statuses: [200]
      require: [data, has_more]
      expect_literal: { has_more: false }
      poll: { attempts: 4, delay_ms: 250, until_nonempty: [data] }
      result_captures: { created_charge: dispute_charge_id }
