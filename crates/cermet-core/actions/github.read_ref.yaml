# `ref` is slash-bearing URL authority (`heads/main`, `tags/v1`), so it is path-mode AND an
# execution target — an allow must pin it, never leave it wildcard.
provider: github
action: read_ref
fields:
  - { name: owner, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,  type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: ref,   type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [owner, name, ref]
execution_targets: [owner, name, ref]
http:
  path_modes: { ref: path }
  steps:
    - id: get
      method: GET
      path: /repos/{owner}/{name}/git/ref/{ref}
