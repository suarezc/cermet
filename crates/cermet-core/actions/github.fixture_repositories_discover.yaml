# Bind ONE exact repository before any sitting mutation: owner/name are exact-pinned identity
# execution targets and the frozen GraphQL document reads that single repository, returning its
# stable database id, canonical `nameWithOwner`, and default branch with the head OID a later
# create_branch/push_commit is anchored to. `viewer { login }` rides along so the read also proves
# which authenticated principal the credential is.
#
# This replaced an account-wide repository SEARCH for a `cermet-sitting-` name prefix. That search
# could not address a designated sandbox whose name does not follow the convention, and an
# inventory search is a strictly wider shape than a pinned read — it enumerated the principal's
# repositories to answer a question about one of them. The action name is unchanged so the verb is
# not retired and re-added; the read is now exact.
# Retention follows the declared catalog default: the body is retained, verbatim.
provider: github
action: fixture_repositories_discover
fields:
  - { name: owner, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,  type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [owner, name]
execution_targets: [owner, name]
http:
  steps:
    - id: repository
      method: POST
      path: /graphql
      success_statuses: [200]
      graphql_query: "query fixtureRepository($owner: String!, $name: String!) { viewer { login } repository(owner: $owner, name: $name) { databaseId id name nameWithOwner isArchived owner { login } defaultBranchRef { name target { oid } } } }"
      require: [data.viewer.login, data.repository.databaseId, data.repository.nameWithOwner, data.repository.owner.login, data.repository.name, data.repository.defaultBranchRef.name, data.repository.defaultBranchRef.target.oid]
      body:
        variables:
          owner: "{owner}"
          name: "{name}"
