# Action template for github.read_workflow_run_jobs (observation). Read the JOBS of ONE Actions
# workflow run on the frozen repository, selected by the run's EXACT immutable `run_id` (an
# exact-pinned identity execution target).
#
# This is the diagnosis workhorse of the Actions vocabulary. `read_workflow_run` answers "did the
# run fail"; this answers "WHERE". Each job in the response carries its own `name`, `status`,
# `conclusion`, and a `steps` array of per-step names and conclusions — so the failing STEP is named
# outright by the projection, without ever fetching a log. That is deliberately as far as this verb
# goes: it reads the run's STRUCTURE, never its output.
#
# Wire shape mirrors read_workflow_run exactly: one bodyless GET, `owner`/`name` plus the run id
# addressing exactly one run's job list — no name-only or filter widening — and `run_id` carrying
# `format: uint` (canonical bare positive decimal) so "1"/"01" can never be two pins for one run.
#
# `per_page=50` is a FIXED query literal, not an agent field, and there is NO page cursor: the verb
# reads one bounded first page and stops. A run with more than fifty jobs is a large matrix build
# whose first page still names a failing job in practice, and `total_count` rides in the response,
# so a truncated read is VISIBLE rather than silent. A paging field would be an agent-steerable
# widening of a read whose whole value is its boundedness — deliberate limit, recorded here as a
# note rather than handling code.
#
# `require: [total_count, jobs]` (the same proof-key pair the runs list already proves): a 200
# carrying neither key is not a job list, and this verb fails closed there rather than rendering a
# reshaped or empty answer as a clean diagnosis. Retention follows the declared default, so the job
# list is stored as an artifact the `artifact` tool can serve in spans.
provider: github
action: read_workflow_run_jobs
fields:
  - { name: owner,  type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,   type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: run_id, type: str, required: true, class: identity, binding: exact_resource_pin, format: uint }
consumes: [owner, name, run_id]
execution_targets: [owner, name, run_id]
http:
  steps:
    - id: jobs
      method: GET
      path: /repos/{owner}/{name}/actions/runs/{run_id}/jobs
      query:
        per_page: "50"
      success_statuses: [200]
      require: [total_count, jobs]
