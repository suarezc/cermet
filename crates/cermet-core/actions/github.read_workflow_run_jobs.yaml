# Reads the run's STRUCTURE, never its output: each job carries a `steps` array of per-step names
# and conclusions, so the failing STEP is named outright without ever fetching a log.
# `per_page=50` is a fixed literal and there is NO cursor: one bounded first page. A paging field
# would be an agent-steerable widening of a read whose whole value is its boundedness, and
# `total_count` rides in the response, so a truncated read is visible rather than silent.
# `require: [total_count, jobs]` — a 200 carrying neither key is not a job list, and the verb fails
# closed there rather than rendering a reshaped or empty answer as a clean diagnosis.
provider: github
action: read_workflow_run_jobs
fields:
  - { name: owner,  type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,   type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: run_id, type: str, required: true, class: identity, binding: exact_resource_pin, format: uint }
consumes: [owner, name, run_id]
execution_targets: [owner, name, run_id]
http:
  steps:
    - id: jobs
      method: GET
      path: /repos/{owner}/{name}/actions/runs/{run_id}/jobs
      query:
        per_page: "50"
      success_statuses: [200]
      require: [total_count, jobs]
