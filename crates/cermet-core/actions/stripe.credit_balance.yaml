# Cermet accepts a positive minor-unit credit amount. Stripe represents customer credit as a negative
# balance transaction, so the frozen bounded amount is negated at rendering and non-positive inputs
# fail before egress.
provider: stripe
action: credit_balance
fields:
  - { name: customer, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: currency, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: amount, type: int, required: true, class: side_effect, binding: bounded }
consumes: [customer, currency, amount]
execution_targets: [customer, currency]
http:
  steps:
    - id: credit
      method: POST
      path: /v1/customers/{customer}/balance_transactions
      body_encoding: form
      body:
        amount: "{amount|negative}"
        currency: "{currency}"
