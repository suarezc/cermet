# The response is GitHub's commit object VERBATIM, including the `verification` block whose
# `payload` is the RAW commit text and whose `signature` is the detached armor — exactly what a
# client needs to reconstruct the object locally and verify the OID it hashes to. A projection here
# would have silently made the fetch unverifiable.
# `format: git_oid` refuses a ref/branch name at admission rather than letting GitHub resolve one,
# so the immutable-object claim is enforced rather than merely asserted.
provider: github
action: read_commit
fields:
  - { name: owner,      type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,       type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: commit_sha, type: str, required: true, class: identity, binding: exact_resource_pin, format: git_oid }
consumes: [owner, name, commit_sha]
execution_targets: [owner, name, commit_sha]
http:
  steps:
    - id: get
      method: GET
      path: /repos/{owner}/{name}/git/commits/{commit_sha}
