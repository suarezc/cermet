# Action template for github.read_commit (broker-fetch). Read one Git COMMIT
# object by its IMMUTABLE OID on the frozen repository — the commit is selected by `commit_sha`, an
# exact-pinned identity, never by a branch/ref name that moves under the approval.
#
# This is the verb that makes `git fetch` expressible as reads: read_ref resolves a branch to a head
# OID, read_commit walks commit → tree + parents, read_tree walks tree → entries, read_blob reads
# leaf content. Every hop is addressed by an immutable object id, so an operator who pinned
# owner/name has pinned the whole reachable read — no deploy key, no clone credential, no shell git.
#
# The response is GitHub's commit object VERBATIM: sha, tree, parents, author/committer,
# message, and — when the commit is signed — the `verification` block whose `payload` is the RAW
# commit object text and whose `signature` is the detached armor. That verbatim body is exactly what
# a client needs to reconstruct the object locally and verify the OID it hashes to; a projection
# here would have silently made the fetch unverifiable.
#
# `commit_sha` carries `format: git_oid`, so a ref/branch name is refused at
# ADMISSION rather than quietly resolved by GitHub — the "immutable object" claim is enforced.
provider: github
action: read_commit
fields:
  - { name: owner,      type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,       type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: commit_sha, type: str, required: true, class: identity, binding: exact_resource_pin, format: git_oid }
consumes: [owner, name, commit_sha]
execution_targets: [owner, name, commit_sha]
http:
  steps:
    - id: get
      method: GET
      path: /repos/{owner}/{name}/git/commits/{commit_sha}
