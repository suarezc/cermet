# Read the connected account's own settlement settings. The credential IS the account, so there is
# no finer resource to pin than the book the key names.
provider: stripe
action: read_account
fields:
  - { name: mode, type: str, required: false, class: identity, binding: exact_resource_pin, source: credential }
consumes: []
execution_targets: [mode]
scope: account
http:
  steps:
    - id: read
      method: GET
      path: /v1/account
      success_statuses: [200]
      require: [id, object, default_currency, payouts_enabled]
      expect_literal: { object: account }
