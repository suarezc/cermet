# Action template for github.request_deployment (provider_control_change).
# Create ONE deployment REQUEST on the frozen repository at an EXACT immutable commit. The
# envelope: owner/name, the commit SHA as `ref` (NOT a branch name — `format: git_oid` refuses a
# ref), and the `environment` — all exact-pinned identity execution targets. HTTP 201 proves the
# deployment REQUEST was created, NOT that anything deployed.
#
# Every consequential field is a FROZEN LITERAL the agent cannot steer:
#   - `task` is the literal `deploy` (never a SHA);
#   - `auto_merge` is fixed `false` (no implicit merge commit — so a commit `ref` always yields 201,
#     never a 202 merge-commit case);
#   - `required_contexts` is the literal `[]` (disclosed: NO status checks are required to gate the
#     request — the request is created regardless of CI state);
#   - `production_environment` and `transient_environment` are fixed `false` exact side effects;
#   - arbitrary `payload` is OMITTED entirely (no free-form deployment payload channel).
# The human pins WHICH environment via `environment`; the booleans above are never agent-fillable.
provider: github
action: request_deployment
fields:
  - { name: owner,       type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,        type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: ref,         type: str, required: true, class: identity, binding: exact_resource_pin, format: git_oid }
  - { name: environment, type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [owner, name, ref, environment]
execution_targets: [owner, name, ref, environment]
http:
  steps:
    - id: create
      method: POST
      path: /repos/{owner}/{name}/deployments
      success_statuses: [201]        # 201 = request CREATED (not deployed). auto_merge:false means
                                     # a commit ref never yields the 202 merge-commit case; any non-201 fails closed.
      require: [id]                  # the created deployment id must be present, never null.
      body:
        ref: "{ref}"
        task: "deploy"
        auto_merge: false
        required_contexts: []
        environment: "{environment}"
        production_environment: false
        transient_environment: false
