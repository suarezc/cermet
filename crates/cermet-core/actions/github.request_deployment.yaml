# HTTP 201 proves the deployment REQUEST was created, NOT that anything deployed.
# The consequential body values are frozen literals the agent cannot steer: `task: deploy`;
# `auto_merge: false`, so a commit `ref` always yields 201 and never the 202 merge-commit case;
# `required_contexts: []`, disclosed here because it means NO status check gates the request; both
# environment booleans false; and no free-form `payload` channel at all. The human pins WHICH
# environment.
provider: github
action: request_deployment
fields:
  - { name: owner,       type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,        type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: ref,         type: str, required: true, class: identity, binding: exact_resource_pin, format: git_oid }
  - { name: environment, type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [owner, name, ref, environment]
execution_targets: [owner, name, ref, environment]
http:
  steps:
    - id: create
      method: POST
      path: /repos/{owner}/{name}/deployments
      success_statuses: [201]
      require: [id]
      body:
        ref: "{ref}"
        task: "deploy"
        auto_merge: false
        required_contexts: []
        environment: "{environment}"
        production_environment: false
        transient_environment: false
