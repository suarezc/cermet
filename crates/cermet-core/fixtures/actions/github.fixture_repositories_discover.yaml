# `viewer { login }` rides along so the read also proves WHICH authenticated principal the
# credential is, not merely that the pinned repository resolves.
provider: github
action: fixture_repositories_discover
fields:
  - { name: owner, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,  type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [owner, name]
execution_targets: [owner, name]
http:
  steps:
    - id: repository
      method: POST
      path: /graphql
      success_statuses: [200]
      graphql_query: "query fixtureRepository($owner: String!, $name: String!) { viewer { login } repository(owner: $owner, name: $name) { databaseId id name nameWithOwner isArchived owner { login } defaultBranchRef { name target { oid } } } }"
      require: [data.viewer.login, data.repository.databaseId, data.repository.nameWithOwner, data.repository.owner.login, data.repository.name, data.repository.defaultBranchRef.name, data.repository.defaultBranchRef.target.oid]
      body:
        variables:
          owner: "{owner}"
          name: "{name}"
