# Create one direct test charge with Stripe's tok_bypassPending token so its funds are immediately
# available for the one-minor-unit payout proof.
provider: stripe
action: fixture_bypass_pending_charge_create
fields:
  - { name: account,  type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: amount,   type: int, required: true, class: side_effect, binding: bounded, max_int: 100 }
  - { name: currency, type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [account, amount, currency]
execution_targets: [account, currency]
http:
  steps:
    - id: bind_account
      method: GET
      path: /v1/account
      success_statuses: [200]
      expect_eq: { id: account }
    - id: prove_test_mode
      method: GET
      path: /v1/balance
      success_statuses: [200]
      expect_literal: { object: balance, livemode: false }
    - id: create
      method: POST
      path: /v1/charges
      body_encoding: form
      body:
        amount: "{amount}"
        currency: "{currency}"
        source: tok_bypassPending
        description: "Cermet payout funding fixture"
      success_statuses: [200]
      require: [id, object, amount, currency, paid, status, livemode]
      expect_eq: { currency: currency }
      expect_literal: { object: charge, paid: true, status: succeeded, livemode: false }
