# Create one test webhook endpoint with the same fixed two-event bundle the corpus update verb uses.
provider: stripe
action: fixture_webhook_endpoint_create
fields:
  - { name: account, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: url,     type: str, required: true, class: identity, binding: exact_resource_pin, format: https_url }
consumes: [account, url]
execution_targets: [account, url]
http:
  steps:
    - id: bind_account
      method: GET
      path: /v1/account
      success_statuses: [200]
      expect_eq: { id: account }
    - id: prove_test_mode
      method: GET
      path: /v1/balance
      success_statuses: [200]
      expect_literal: { object: balance, livemode: false }
    - id: create
      method: POST
      path: /v1/webhook_endpoints
      body_encoding: form
      body:
        url: "{url}"
        enabled_events: [charge.succeeded, charge.failed]
      success_statuses: [200]
      require: [id, object, url, status, enabled_events, livemode]
      expect_eq: { url: url }
      expect_literal: { object: webhook_endpoint, enabled_events: [charge.succeeded, charge.failed], livemode: false }
