# A descriptor is the ONLY way a credential may ride to an origin: `egress` pins the exact
# scheme+host+port and `auth` names how the token is presented.
# Advancing X-GitHub-Api-Version is an EXPLICIT descriptor replacement: it changes this file's
# SHA-256, so every github sidecar's `provider_descriptor_sha256` must be recomputed in lockstep.
name: github
egress:
  - https://api.github.com
auth: bearer
headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: "2026-03-10"
# Request sugar: `repo: "owner/name"` splits into the owner + name fields the templates pin.
split:
  - field: repo
    into: [owner, name]
    sep: "/"
# The git transport pin: `github.push` carries a packfile to github.com, a DIFFERENT origin from
# the REST API's, and only a descriptor may let a credential ride to an origin. The token rides
# `http.<url>.extraHeader` through environment config, never argv.
git:
  origin: https://github.com
  auth: basic:x-access-token
