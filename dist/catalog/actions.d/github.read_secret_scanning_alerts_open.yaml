# Action template for github.read_secret_scanning_alerts_open (sensitive_observation).
# Read one bounded first page of OPEN secret-scanning alerts for the frozen
# repository. `state=open`, `per_page=30`, and `hide_secret=true` are fixed query literals, not agent
# fields; no page cursor exists, and GitHub is instructed not to return the detected secret value.
#
# GitHub alert objects include the literal LEAKED THIRD-PARTY CREDENTIAL in `secret`. Under the
# verbatim response contract this verb RETURNS IT: the `keep` list that excluded it is retired
# with every other response projection, and that is an accepted, documented consequence.
# SAY WHAT WE SHIP: **this verb returns detected secret
# material verbatim.** The surviving bound is request-side and is the fixed `hide_secret=true`
# query literal below, which instructs GitHub not to send the value at all; `retention: none`
# additionally stores no artifact. `github` is not a product-enabled provider, so nothing
# agent-reachable is affected today; the reopen condition is the GitHub product-enable decision.
provider: github
action: read_secret_scanning_alerts_open
fields:
  - { name: owner, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,  type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [owner, name]
execution_targets: [owner, name]
http:
  steps:
    - id: list
      method: GET
      path: /repos/{owner}/{name}/secret-scanning/alerts
      success_statuses: [200]
      query:
        state: "open"
        per_page: "30"
        hide_secret: "true"
      retention: none
