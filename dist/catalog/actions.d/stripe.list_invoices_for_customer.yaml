# List only the first ten invoices for one exact customer. No cursor or account-wide variant exists.
provider: stripe
action: list_invoices_for_customer
fields:
  - { name: customer, type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [customer]
execution_targets: [customer]
http:
  steps:
    - id: list
      method: GET
      path: /v1/invoices
      success_statuses: [200]
      query:
        customer: "{customer}"
        limit: "10"
      require: [data, has_more]
