# Action template for github.read_job_log (observation). Read the LOG of ONE Actions job on the
# frozen repository, selected by the job's EXACT immutable `job_id` — the last step of the
# diagnosis ladder that `read_workflow_run` (did it fail) and `read_workflow_run_jobs` (which job,
# which step) start.
#
# THE MINTED-URL SHAPE — the relay pattern at single-request scale. GitHub answers this endpoint's
# credentialed GET with `302 Found`, an EMPTY body, and a `Location` header carrying a pre-signed,
# self-authorizing, ~60-second blob URL. The redirect IS the answer here, not a detour on the way to
# one, and the broker's entire job is the credentialed MINT: spend the vaulted credential once, hand
# back the scoped expiring capability it bought, and stop. The bytes of the log are moved by the
# agent's own credential-free `curl` — exactly the division of labour `vercel.deploy` runs at
# session scale, compressed into one request. Cermet is authorization and receipt; a log is a
# carrier problem, and curl is the native tool that already owns it.
#
# CUSTODY. What the receipt carries is a DERIVED grant, never the vault credential: the URL's
# signature authorizes exactly one blob for about a minute, it cannot be replayed against any other
# GitHub resource, and it expires on its own. The token that minted it never leaves the trusted
# runtime — it rides only the Authorization header of the single GET below. So the receipt carrying
# this URL is deliberate, not a leak: it is the whole product of the hop, and it is what makes the
# next (credential-free) step possible. Its short life is also why the receipt is worth re-running
# rather than mining later — a stale receipt's URL is simply dead.
#
# `success_statuses: [302]` is what makes the 302 a success at all (the pinnable set widens to
# 2xx-or-3xx, per step, by declaration only — an undeclared redirect still fails closed everywhere).
# `retain_headers: [location]` lifts the minted URL into the BROKER-AUTHORED envelope beside the
# response, never into it: the response contract stays verbatim, and an absent `Location` fails the
# step closed naming the header, because a mint with nothing minted is not a success with a hole in
# it.
#
# The engine does NOT follow the redirect (`redirect::Policy::none()` stands), does not open a
# second egress origin, does not read a byte of the log, and makes exactly ONE request. There is no
# response-kind machinery, no text/artifact body path, and no size cap to raise, because none of
# that is on this path.
#
# Wire shape mirrors read_workflow_run_jobs: one bodyless GET, `owner`/`name` plus the job id
# addressing exactly one job — no name-only or filter widening — and `job_id` carrying `format:
# uint` (canonical bare positive decimal) so "1"/"01" can never be two pins for one job.
#
# `retention: none`: a 302 has no body, so there is nothing to store as an artifact. That is a
# statement about this response, not a narrowing of it.
provider: github
action: read_job_log
fields:
  - { name: owner,  type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,   type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: job_id, type: str, required: true, class: identity, binding: exact_resource_pin, format: uint }
consumes: [owner, name, job_id]
execution_targets: [owner, name, job_id]
http:
  steps:
    - id: mint
      method: GET
      path: /repos/{owner}/{name}/actions/jobs/{job_id}/logs
      success_statuses: [302]
      retain_headers: [location]
      retention: none
