# Action template for github.read_thread (sensitive_observation). Read the
# metadata of ONE issue/PR thread on the frozen repository, selected by its EXACT `number` — an
# exact thread target. `number` is the issue/PR number as a string path
# segment (an exact-pinned identity execution target), so an allow scopes to one thread and an agent
# can never enumerate the tracker.
#
# The response is GitHub's thread body VERBATIM, retained as an artifact under the
# declared default. Comment BODIES are still not fetched — that is a REQUEST-side bound
# (this endpoint returns thread metadata; a separate bounded comment read defers), which is the kind
# of bound that survives the verbatim contract.
#
# `number` carries `format: uint` — a canonical bare positive decimal, so "1" and "01" can
# never be two distinct pins for the same thread.
provider: github
action: read_thread
fields:
  - { name: owner,  type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,   type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: number, type: str, required: true, class: identity, binding: exact_resource_pin, format: uint }
consumes: [owner, name, number]
execution_targets: [owner, name, number]
http:
  steps:
    - id: get
      method: GET
      path: /repos/{owner}/{name}/issues/{number}
