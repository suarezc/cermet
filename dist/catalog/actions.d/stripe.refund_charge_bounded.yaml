# Refund one bounded amount against an exact charge in its provider-resolved account/mode/currency.
# Transfer reversal, application-fee refund, fraud marking, reason, and currency input are absent.
provider: stripe
action: refund_charge_bounded
request_evidence: stripe.refund_charge_bounded.v1
money:
  preconditions: [charge_refundable]
fields:
  - { name: charge, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: amount, type: int, required: true, class: side_effect, binding: bounded }
  - { name: account, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: mode, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: currency, type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [charge, amount]
execution_targets: [charge, account, mode, currency]
http:
  steps:
    - id: refund
      method: POST
      path: /v1/refunds
      body_encoding: form
      body: { charge: "{charge}", amount: "{amount}" }
      success_statuses: [200]
      require: [id, object, charge, amount, currency, status]
      expect_eq: { charge: charge, amount: amount, currency: currency }
      expect_literal: { object: refund }
      retention: none
