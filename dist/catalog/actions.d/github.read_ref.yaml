# Action template for github.read_ref. Resolve one fully-qualified Git ref
# on the frozen repository to its current object OID and type. Addressing is frozen identity: owner,
# name, and the exact ref (e.g. `heads/main`, `tags/v1`). `ref` is slash-bearing URL authority, so it
# is path-mode `path` AND an execution target — an allow must pin it, never leave it wildcard.
#
# The read returns the object OID and type only (plus node_id) — the immutable handle a later
# read_tree/read_blob is addressed by.
provider: github
action: read_ref
fields:
  - { name: owner, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,  type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: ref,   type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [owner, name, ref]
execution_targets: [owner, name, ref]
http:
  path_modes: { ref: path }
  steps:
    - id: get
      method: GET
      path: /repos/{owner}/{name}/git/ref/{ref}
