# Retrieve one exact PaymentIntent, but never expose its client capability or payment instrument.
# Provider error bodies are RETAINED as failure evidence.
# The response is returned VERBATIM: the PaymentIntent arrives
# whole on the 2xx path, and an error arrives as {status, error: <the provider's body>}.
provider: stripe
action: get_payment_intent
fields:
  - { name: payment_intent, type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [payment_intent]
execution_targets: [payment_intent]
http:
  steps:
    - id: get
      method: GET
      path: /v1/payment_intents/{payment_intent}
      success_statuses: [200]
      require: [id, object, status]
