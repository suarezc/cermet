# Action template for github.read_repo. One GET against the frozen owner/name.
#
# Downstream reads/writes anchor on the STABLE repository IDs — the
# database `id` and the GraphQL `node_id` — rather than the mutable `full_name`. The response itself
# is GitHub's repository body VERBATIM, retained under the declared default;
# those IDs are simply the fields callers bind on. owner/name remain frozen execution targets (GitHub
# offers no numeric-id contents read; the repo IS addressed by owner/name, both exact-pinned).
provider: github
action: read_repo
fields:
  - { name: owner, type: str, required: true, class: identity, binding: exact_resource_pin }
  - { name: name,  type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [owner, name]
execution_targets: [owner, name]
http:
  steps:
    - id: get
      method: GET
      path: /repos/{owner}/{name}
