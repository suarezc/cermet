provider: stripe
action: pause_subscription
fields:
  - { name: subscription, type: str, required: true, class: identity, binding: exact_resource_pin }
consumes: [subscription]
execution_targets: [subscription]
http:
  steps:
    - id: pause
      method: POST
      path: /v1/subscriptions/{subscription}
      body_encoding: form
      body:
        pause_collection:
          behavior: void
