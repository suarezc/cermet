# /etc/cermetd/config.toml — cermetd configuration template (macOS).
#
# The macOS twin of dist/linux/config.toml. Same schema, same daemon, same three-uid topology —
# only the platform paths differ, and a unit test (`the_two_config_templates_declare_the_same_keys`)
# fails if one template ever grows a key the other lacks.
#
# Installed 0644 root:wheel by `sudo cermet setup`. The DBs and master key (which this file does
# NOT contain) live under CERMET_HOME=/var/lib/cermetd, 0700 _cermet:_cermet. The binaries live in
# the root-owned prefix /opt/cermet/bin — NOT /usr/local/bin, which belongs to Homebrew and is
# writable by the operator's own uid; setup puts that prefix on PATH via /etc/paths.d/cermet, and
# touches nothing under /usr/local except to delete any older binaries that would shadow it.

# --- Service identity ------------------------------------------------------------------
# The dedicated, non-login role account cermetd runs as, provisioned by `cermet setup` via dscl.
# macOS reserves the leading underscore for role accounts. The daemon owns the vault and is the
# only component that ever decrypts a credential; running as its own uid is what makes the file
# ACLs a kernel-enforced boundary rather than a convention.
service_user = "_cermet"

# Optional explicit uid for the service user. `cermet setup` fills this in from the provisioned
# account; the daemon derives "who am I" from getuid() at runtime, so this is an install-assertion
# input, not a runtime authority.
# service_uid = 0   # <-- placeholder; do not leave 0 (0 == root). Pin a real role-account uid.

# --- Approver (v1: a SINGLE uid, not a group) ------------------------------------------
# The one human uid permitted to approve `Ask` grants and use the ctl.sock control channel. This
# is a DIFFERENT uid from service_user above: the approver≠daemon split is what keeps approvals
# human-only, and the daemon must never be able to satisfy this check itself.
#
# REQUIRED: replace the placeholder with the approver's real uid (e.g. `id -u alice`). Leaving it
# unset / equal to service_uid is a misconfiguration the daemon's refuse-to-serve doctor rejects.
approver_uid = 0   # <-- REPLACE. Must NOT equal service_uid. `id -u <approver>`.

# --- Vault-key custody (the declared ladder) --------------------------------------------
# WHICH mechanism holds this box's vault key. `cermet setup` selects the strongest rung this
# machine can actually carry and WRITES IT HERE — the ladder is automatic, but never silent.
#
# macOS has ONE rung today:
#
#   custody_profile = "file-protected"
#       a _cermet-owned 0600 master.key under CERMET_HOME. Peer uids and unprivileged agents get a
#       kernel EACCES; it does not protect the vault key from disk snapshots or backups.
#
# The sealed rungs — "systemd-tpm2+host" and "systemd-host" — are systemd credential delivery and
# exist on Linux only. A System-keychain / SEP-backed rung is macOS's future step up, and will be a
# NAMED profile with its own assurance, never a silent change to this one.
#
# This key is AUTHORITATIVE for the daemon's key SOURCE, not a description of it: cermetd reads
# exactly the source this names and refuses anything else. There is deliberately NO default — in
# service mode an absent custody_profile is a refusal naming `cermet setup`, because a guessed key
# source either opens nothing or opens the wrong vault. Do not hand-edit it: changing this line
# does not move the key.
#
# CHOSEN ONCE: the rung is selected at FIRST provisioning and re-runs of `cermet setup` re-declare
# whichever rung this box is already on — the key that exists is the key the vault is encrypted
# under. Moving to a STRONGER rung today means re-keying with `--force-clean-bootstrap`, which is a
# vendor reset and destroys the vault. A lossless in-place rung upgrade is queued post-launch.
# custody_profile = "file-protected"   # <-- `cermet setup` writes the declared line at the end of this file.

# --- Socket runtime dir ----------------------------------------------------------------
# The setgid dir holding ctl.sock and owner.sock: 2711 _cermet:cermet-approvers, so the ctl.sock
# the daemon binds INHERITS cermet-approvers with no chgrp (the daemon is not in that group and a
# chgrp would EPERM). `cermet setup` converges it; the daemon asserts the exact 2711 layout before
# binding and refuses otherwise.
#
# It is NOT under /var/run: macOS wipes /var/run at every boot, and a LaunchDaemon running as
# _cermet cannot recreate a root-owned dir there. A persistent /var dir needs no boot helper, which
# is what lets this platform ship ONE plist instead of two.
runtime_dir = "/var/cermetd"          # ctl.sock + owner.sock dir (2711 _cermet:cermet-approvers).

# --- Agent plane (the distinct model-driven agent uid) ---------------------------------
# The dedicated `cermet-agent` account the model-driven MCP bridge runs as: a THIRD uid, distinct
# from BOTH service_uid (the daemon) and approver_uid (the human). agent.sock admits ONLY this uid;
# ctl.sock admits ONLY the approver — so the agent plane and the approval plane are kernel-separated
# and human-only approval becomes a kernel property. Provisioned by `cermet setup` (sole member of
# the cermet-agents group) and seeded here for you (override with CERMET_AGENT_UID).
#
# REQUIRED in service mode (never optional): missing, 0 (root), == service_uid, or == approver_uid is a
# uid-collapse the daemon's refuse-to-serve doctor rejects. `id -u cermet-agent`.
agent_uid = 0   # <-- REPLACE. Must NOT equal service_uid or approver_uid. `id -u cermet-agent`.

# The SEPARATE runtime dir holding agent.sock and git.sock, converged as 2711 _cermet:cermet-agents
# (both sockets inherit the cermet-agents group; the distinct agent uid reaches them, the approver
# and world cannot). Persistent for the same reason as runtime_dir above.
agent_runtime_dir = "/var/cermetd-agents"   # agent.sock + git.sock dir (2711 _cermet:cermet-agents).

# --- Egress ----------------------------------------------------------------------------
# There is no egress config key. Provider origins are BAKED into the vendored descriptors and
# pinned in-core on every call (Egress::allows; never user- or agent-settable).

# --- Sentence authority (the daemon-native `cermet rules allow` ceremony) ---------------
# The human-owned rule file whose exact bytes confer authority ONLY when their SHA-256 matches the
# daemon-held pin (CERMET_HOME/sentence.pin, 0600 _cermet:_cermet). Installed by `cermet setup` in
# a 2750 setgid dir owned by _cermet:cermet-approvers: the approver owns/writes it, the _cermet
# daemon reads it via the group. Leaving this unset means every sentence-gated request fails closed.
sentence_rules_path = "/etc/cermetd/sentences/rules.cermet"

# --- Sentence language: temporal (windowed) clauses ------------------------------------
# OFF by default. A decision is a pure function of (request, corpus):
# nothing accumulated — no counter, no window, no running total — is consulted when a request is
# decided. That is what makes a sentence answerable by reading it, and a receipt explainable
# without replaying history.
#
# The two clauses this suspends are the only ones that read accumulated state. They are metered
# from the audit ledger over a fixed calendar window:
#     ... where budget amount 50000 per day
#     ... where rate 10 per hour
# PER-REQUEST bounds are a different thing and are unaffected: an amount ceiling, an amount floor,
# an exact pin, and a finite set all evaluate from the request alone and stay live whatever this
# key says.
#
# With this false, a corpus carrying either clause is REFUSED at admission (`cermet doc apply`,
# `cermet rules allow`) with a message naming this key — never silently accepted with the clause
# dropped, which would turn an authored cap into unmetered standing authority. Set it true to
# restore the previous behavior exactly: the machinery is gated, not removed. Flipping it does not
# rewrite the live corpus — re-apply the corpus afterwards.
#
# A live corpus that already carries one of these clauses does NOT keep working when this is false:
# boot adoption re-validates the standing corpus, that validation fails, and the daemon then DENIES
# every sentence-routed request — naming the failing rule and this key in the deny — until the corpus
# is re-applied without the clause (or this key is set true). Check with `cermet doc check` before
# flipping it off on a box whose live corpus uses one.
# language_temporal_clauses = false

# --- Artifact store --------------------------------------------------------------------
# Command/tool output (S3) is stored content-addressed under CERMET_HOME/artifacts, _cermet-owned
# so the agent cannot rewrite history after it is recorded. Both knobs are optional.
#   artifact_max_bytes:      per-blob ceiling; overflow keeps head+tail and marks truncated.
#   artifact_retention_days: startup sweep drops blobs older than this (0 = keep forever).
# artifact_max_bytes = 5242880       # 5 MiB
# artifact_retention_days = 90

# --- The git seam (plain `git push` on a `cermet::` remote) -----------------------------
# A push is decided by GIT'S OWN update hook on a daemon-held mirror, not by an agent request. The
# daemon wires an SO_PEERCRED-attested stream (git.sock) to `git receive-pack` on that mirror, git
# does the transfer, and Cermet appears exactly twice: the hook decision and the credentialed hop
# that carries the authorized update upstream. A refusal comes back in git's own error vocabulary.
#
# There is NO registration step: `git_binary` defaults to this box's git. Usability (it runs, and
# reports >= 2.31 for the environment-config credential channel) is checked PER REQUEST; a missing
# or too-old git refuses git operations naming this key while every other verb is unaffected. On a
# stock Mac /usr/bin/git is the Command Line Tools shim — set this to a real git (e.g. a Homebrew
# one) if the shim is not installed.
#   git_binary:      ABSOLUTE path of the git to run (absolute on purpose: a relative name would be
#                    resolvable by whatever is on PATH, and this one is root-owned).
#   git_mirror_dir:  root of the persistent 0700 per-remote bare mirrors, under CERMET_HOME.
#                    Persistence is what makes every push after the first O(delta).
#   git_max_push_bytes: ceiling on the bytes ONE push may write into a mirror, written into each
#                    mirror's own config as `receive.maxInputSize` so GIT enforces it. It bounds an
#                    UNAUTHORIZED push too: the pack is received before any decision exists.
#   git_timeout_secs: wall-clock ceiling on ONE hermetic invocation (the credentialed hop).
#   git_mirror_retention_days: drop mirrors with no authorized contact this long, swept at startup
#                    (0 = keep forever). There is no credentialed fetch refresh yet, so a swept
#                    mirror is rebuilt from what the next push carries, not from the upstream.
# git_binary = "/usr/bin/git"
# git_mirror_dir = "/var/lib/cermetd/mirrors"
# git_max_push_bytes = 536870912
# git_timeout_secs = 300
# git_mirror_retention_days = 90

# --- Loopback relay --------------------------------------------------------------------
# The seam for `execution: relay` verbs (today: vercel.deploy). A relay verb does not construct a
# provider request — the NATIVE client does. `cermet` hands the agent a grant HANDLE and a loopback
# URL; every request the CLI makes arrives here, is checked against the verb's declared predicate,
# and only then gets the vaulted credential swapped in and forwarded to the pinned origin. A request
# matching no admitted shape is refused WITHOUT the credential, audited, and the session is BURNED.
#
# The listener is LOOPBACK-ONLY and every request needs an unguessable handle, so another uid on the
# box reaches nothing without one.
#   relay_listen:         loopback host:port to bind. EMPTY ("") disables the relay entirely.
#   relay_ttl_secs:       how long one relay session stays usable after it opens.
#   relay_max_body_bytes: cap on one buffered request or response body (a memory bound).
# relay_listen = "127.0.0.1:7133"
# relay_ttl_secs = 600
# relay_max_body_bytes = 33554432    # 32 MiB
